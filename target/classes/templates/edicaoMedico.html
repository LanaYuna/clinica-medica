<!DOCTYPE html>
<html>
<head>
<meta charset="ISO-8859-1">
<title>Edição</title>
</head>
<body>

	<form action="/edicaoMedico" method="POST">
		<h1>Cadastro Medico</h1>
	
		<div>
			<div>
				<label for="nome">Nome</label>
				<input type="text" name="nome" th:value=${medicoEsperado.nome} required>
			</div>
			<div>
				<label for="email">Email</label>
				<input type="email" name="email" th:value=${medicoEsperado.email} required>
			</div>
			<div>
				<label for="cpf">cpf</label>
				<input type="text" name="cpf" th:value=${medicoEsperado.cpf} required>
			</div>
			<div>
				<label for="crm">crm</label>
				<input type="text" name="crm" th:value=${medicoEsperado.crm} required>
			</div>
		</div>
	
	
		<button type="submit">Enviar</button>
	</form>
</body>
</html>
