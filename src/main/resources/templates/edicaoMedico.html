<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edição de Médico</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen bg-blue-50 flex items-center justify-center px-6 py-10">

    <main class="w-full max-w-2xl bg-white rounded-3xl shadow-xl px-8 py-12 md:px-12">

        <header class="text-center mb-10">

            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight text-blue-900">
                Edição de Médico
            </h1>

            <p class="mt-4 text-base md:text-lg text-gray-500">
                Atualize os dados do profissional.
            </p>

        </header>

        <form action="/edicaoMedico" method="POST" class="space-y-6">

            <div>
                <label for="nome" class="block text-sm font-semibold text-gray-700 mb-2">
                    Nome
                </label>

                <input type="text"
                       id="nome"
                       name="nome"
                       th:value="${medicoEncontrado.nome}"
                       required
                       class="w-full px-4 py-3 border border-blue-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700">
            </div>

            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-2">
                    E-mail
                </label>

                <input type="email"
                       id="email"
                       name="email"
                       th:value="${medicoEncontrado.email}"
                       required
                       class="w-full px-4 py-3 border border-blue-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700">
            </div>

            <div>
                <label for="cpf" class="block text-sm font-semibold text-gray-700 mb-2">
                    CPF
                </label>

                <input type="text"
                       id="cpf"
                       name="cpf"
                       th:value="${medicoEncontrado.cpf}"
                       required
                       class="w-full px-4 py-3 border border-blue-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700">
            </div>

            <div>
                <label for="crm" class="block text-sm font-semibold text-gray-700 mb-2">
                    CRM
                </label>

                <input type="text"
                       id="crm"
                       name="crm"
                       th:value="${medicoEncontrado.crm}"
                       required
                       class="w-full px-4 py-3 border border-blue-100 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-gray-700">
            </div>

            <div>

                <label class="block text-sm font-semibold text-gray-700 mb-3">
                    Especialidades
                </label>

                <div class="space-y-3">

                    <div th:each="especialidade : ${especialidades}"
                         class="flex items-center gap-3">

                        <input type="checkbox"
                               name="especialidades"
                               th:value="${especialidade.name()}"
                               th:checked="${medicoEncontrado.especialidades.contains(especialidade)}"
                               class="w-4 h-4 accent-blue-600">

                        <span th:text="${especialidade.descricao}"
                              class="text-gray-600">
                        </span>

                    </div>

                </div>

            </div>

            <div class="flex justify-center gap-3 pt-4">

                <a href="/inicio"
                   class="inline-flex items-center bg-blue-50 hover:bg-blue-100 text-blue-700 font-semibold px-5 py-2.5 rounded-lg border border-blue-100 transition-all duration-200">
                    Voltar
                </a>

                <button type="submit"
                        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2.5 rounded-lg shadow-sm hover:shadow-md transition-all duration-200">
                    Salvar alterações
                </button>

            </div>

        </form>

    </main>

</body>

</html>
