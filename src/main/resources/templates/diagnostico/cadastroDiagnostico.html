<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Diagnóstico</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-blue-50 min-h-screen">
    
    <div class="flex justify-center px-4 py-6">

        <form action="/cadastroDiagnostico" method="POST" class="bg-white p-6 sm:p-8 rounded-lg shadow-md w-full max-w-3xl">

            <a href="inicio">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-gray-600 hover:text-black">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
            </a>
            
            <div th:if="${mensagemErro}"
		         class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 mx-auto max-w-3xl mt-4"
		         role="alert">
		        <strong class="font-bold">Atenção: </strong>
		        <span th:text="${mensagemErro}" class="block sm:inline"></span>
		    </div>
            
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">
                Cadastro de Diagnóstico
            </h1>

            <section class="mb-8">

                <h2 class="text-lg font-semibold text-gray-700 border-b border-gray-300 pb-2 mb-5">
                    Atendimento
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <div class="flex flex-col">
                        <label for="idMedico" class="font-medium text-gray-700">
                            Médico
                        </label>
                        <select id="idMedico" name="idMedico"
                                class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                                required>
                            <option value="">Selecione...</option>
                            <option th:each="medico : ${medicos}"
                                    th:value="${medico.id}"
                                    th:text="${medico.nome}"></option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label for="idPaciente" class="font-medium text-gray-700">
                            Paciente
                        </label>
                        <select id="idPaciente" name="idPaciente"
                                class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                                required>
                            <option value="">Selecione...</option>
                            <option th:each="paciente : ${pacientes}"
                                    th:value="${paciente.id}"
                                    th:text="${paciente.nome}"></option>
                        </select>
                    </div>

                    <div class="flex flex-col">
                        <label for="dataHora" class="font-medium text-gray-700">
                            Data e hora
                        </label>
                        <input type="datetime-local" id="dataHora" name="dataHora"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>

                    <div class="flex flex-col">
                        <label for="tipoAtendimento" class="font-medium text-gray-700">
                            Tipo de atendimento
                        </label>
                        <select id="tipoAtendimento" name="tipoAtendimento"
                                class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                                required>
                            <option value="">Selecione...</option>
                            <option th:each="tipo : ${tiposAtendimento}"
                                    th:value="${tipo.name()}"
                                    th:text="${tipo.descricao}"></option>
                        </select>
                    </div>

                </div>

            </section>

            <section class="mb-8">

                <h2 class="text-lg font-semibold text-gray-700 border-b border-gray-300 pb-2 mb-5">
                    Diagnóstico
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <div class="flex flex-col">
                        <label for="cid10" class="font-medium text-gray-700">
                            CID-10 (opcional)
                        </label>
                        <input type="text" id="cid10" name="cid10"
                               placeholder="Ex.: J00 ou J00.0"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500">
                    </div>

                    <div class="flex flex-col sm:col-span-2">
                        <label for="descricao" class="font-medium text-gray-700">
                            Descrição
                        </label>
                        <textarea id="descricao" name="descricao" rows="3"
                                  class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                                  required></textarea>
                    </div>

                    <div class="flex flex-col sm:col-span-2">
                        <label for="sintomas" class="font-medium text-gray-700">
                            Sintomas
                        </label>
                        <textarea id="sintomas" name="sintomas" rows="3"
                                  class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                                  required></textarea>
                    </div>

                    <div class="flex flex-col sm:col-span-2">
                        <label for="medicamentos" class="font-medium text-gray-700">
                            Medicamentos
                        </label>
                        <textarea id="medicamentos" name="medicamentos" rows="3"
                                  class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                                  required></textarea>
                    </div>

                    <div class="flex flex-col sm:col-span-2">
                        <label for="observacoes" class="font-medium text-gray-700">
                            Observações
                        </label>
                        <textarea id="observacoes" name="observacoes" rows="3"
                                  class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                                  required></textarea>
                    </div>

                </div>

            </section>

            <button type="submit"
                    class="w-full mt-8 bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
                Salvar
            </button>

        </form>

    </div>

</body>
</html>
