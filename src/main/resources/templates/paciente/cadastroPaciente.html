<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro Paciente</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-blue-50 min-h-screen">

    <div class="flex justify-center px-4 py-6">

        <form action="/cadastroPaciente" method="POST" class="bg-white p-6 sm:p-8 rounded-lg shadow-md w-full max-w-3xl">

 			<a href="inicio">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-gray-600 hover:text-black">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
            </a>
            
            <div th:if="${mensagemErro}"
		         class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4 mx-auto max-w-3xl mt-4"
		         role="alert">
		        <strong class="font-bold">Atenção: </strong>
		        <span th:text="${mensagemErro}" class="block sm:inline"></span>
		    </div>

            <h1 class="text-3xl font-bold text-center text-gray-800 mb-8">
                Cadastro de Paciente
            </h1>

            <section class="mb-8">

                <h2 class="text-lg font-semibold text-gray-700 border-b border-gray-300 pb-2 mb-5">
                    Dados Pessoais
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

                    <div class="flex flex-col">
                        <label for="nome" class="font-medium text-gray-700">
                            Nome Completo
                        </label>
                        <input type="text" id="nome" name="nome"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>

                    <div class="flex flex-col">
                        <label for="email" class="font-medium text-gray-700">
                            E-mail
                        </label>
                        <input type="email" id="email" name="email"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>

                    <div class="flex flex-col">
                        <label for="cpf" class="font-medium text-gray-700">
                            CPF
                        </label>
                        <input type="text" id="cpf" name="cpf"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>

                    <div class="flex flex-col">
                        <label for="dataNascimento" class="font-medium text-gray-700">
                            Data de nascimento
                        </label>
                        <input type="date" id="dataNascimento" name="dataNascimento"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>
                    
                    <div class="flex flex-col">
                        <label for="telefone" class="font-medium text-gray-700">
                            Telefone / Celular
                        </label>
                        <input type="text" id="telefone" name="telefone"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>

                </div>

            </section>

            <section class="mb-8">

                <h2 class="text-lg font-semibold text-gray-700 border-b border-gray-300 pb-2 mb-5">
                    Endereço
                </h2>

                <div class="grid grid-cols-1 sm:grid-cols-6 gap-4">

                    <div class="flex flex-col sm:col-span-2">
                        <label for="cep" class="font-medium text-gray-700">
                            CEP
                        </label>
                        <input type="text" id="cep" name="cep"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>

                    <div class="flex flex-col sm:col-span-3">
                        <label for="logradouro" class="font-medium text-gray-700">
                            Logradouro (Rua/Av.)
                        </label>
                        <input type="text" id="logradouro" name="logradouro"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>

                    <div class="flex flex-col sm:col-span-1">
                        <label for="numero" class="font-medium text-gray-700">
                            Número
                        </label>
                        <input type="text" id="numero" name="numero"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>

                    <div class="flex flex-col sm:col-span-2">
                        <label for="complemento" class="font-medium text-gray-700">
                            Complemento
                        </label>
                        <input type="text" id="complemento" name="complemento"
                               placeholder="Apto, Bloco, etc."
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500">
                    </div>

                    <div class="flex flex-col sm:col-span-2">
                        <label for="bairro" class="font-medium text-gray-700">
                            Bairro
                        </label>
                        <input type="text" id="bairro" name="bairro"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>

                    <div class="flex flex-col sm:col-span-2">
                        <label for="cidadeUf" class="font-medium text-gray-700">
                            Cidade / UF
                        </label>
                        <input type="text" id="cidadeUf" name="cidadeUf"
                               placeholder="Ex.: Toledo / PR"
                               class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500"
                               required>
                    </div>

                </div>

            </section>
	
           <button type="submit" 
           		   class="w-full mt-8 bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
               Salvar
           </button>


        </form>

    </div>

</body>
</html>
