<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Paciente</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-blue-50 min-h-screen">

	<div th:if="${mensagemErro}" 
	     class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" 
	     role="alert">
	    <strong class="font-bold">Atenção: </strong>
	    <span th:text="${mensagemErro}" class="block sm:inline"></span>
	</div>

    <div class="flex justify-center pt-6 pb-6">
    
        <form action="/cadastroPaciente" method="POST" class="bg-white p-8 rounded-lg shadow-md w-140">
        
            <a href="inicio">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6 text-gray-600 hover:text-black">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5 3 12m0 0 7.5-7.5M3 12h18" />
                </svg>
            </a>
    
            <h1 class="text-3xl font-bold my-4">Cadastro de Paciente</h1>
        
            <div class="flex flex-col gap-4">
            
                <div class="flex flex-col">
                    <label for="nome" class="font-medium text-gray-700">Nome Completo</label>
                    <input type="text" id="nome" name="nome" class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500" required>
                </div>
                
                <div class="flex flex-col">
                    <label for="email" class="font-medium text-gray-700">E-mail</label>
                    <input type="email" id="email" name="email" class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500" required>
                </div>
                
                <div class="flex flex-col">
                    <label for="cpf" class="font-medium text-gray-700">CPF</label>
                    <input type="text" id="cpf" name="cpf" class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500" required>
                </div>
                
                <div class="flex flex-col">
                    <label for="crm" class="font-medium text-gray-700">Data de nascimento</label>
                    <input type="text" id="crm" name="crm" class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500" required>
                </div>
                
				<div class="flex flex-col">
                    <label for="crm" class="font-medium text-gray-700">Telefone / Celular</label>
                    <input type="text" id="crm" name="crm" class="mt-2 rounded-lg shadow-sm border border-gray-300 p-2 focus:outline-blue-500" required>
                </div>
                               
            </div>
            
            <button type="submit" class="w-full mt-8 bg-blue-600 text-white font-semibold py-2 px-4 rounded-md hover:bg-blue-700 transition-colors">
                Salvar
            </button>
        </form>
        
    </div>

</body>
</html>
